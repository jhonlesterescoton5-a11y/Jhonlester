<!DOCTYPE html>
<html>
<head>
  <title>Your Room</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Welcome <span id="userName"></span>!</h1>
  <p>Pili ka ng mood mo:</p>
  <button onclick="changeMood('happy')">😊 Masaya</button>
  <button onclick="changeMood('chill')">😌 Chill</button>
  <button onclick="changeMood('study')">📚 Study</button>
  <button onclick="logout()">Logout</button>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <script>
    // KOPYAHIN MO DITO YUNG firebaseConfig MO GALING SA script.js
    const firebaseConfig = {
      apiKey: "ILAGAY_MO_DITO",
      authDomain: "ILAGAY_MO_DITO",
      projectId: "ILAGAY_MO_DITO",
      storageBucket: "ILAGAY_MO_DITO",
      messagingSenderId: "ILAGAY_MO_DITO",
      appId: "ILAGAY_MO_DITO"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
      if(user) {
        db.collection("users").doc(user.uid).get().then(doc => {
          document.getElementById("userName").innerText = doc.data().name;
        })
      } else {
        window.location.href = "index.html";
      }
    });

    function logout() {
      auth.signOut();
    }

    function changeMood(mood) {
      let user = auth.currentUser;
      db.collection("users").doc(user.uid).update({mood: mood});
      alert("Na-save yung mood mo: " + mood);
      document.body.style.background = mood === 'happy' ? 'yellow' : mood === 'chill' ? 'lightblue' : 'gray';
    }
  </script>
</body>
</html>
